[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fairy-farm"
version = "0.1.0"
description = "FAIRY farm-agent simulation package decoupled from ARE."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
  "openai-agents>=0.0.14",
  "numpy>=1.24",
]

[project.scripts]
fairy-run = "fairy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fairy"]

