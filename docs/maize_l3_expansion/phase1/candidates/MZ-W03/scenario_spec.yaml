  sowing:
  - MAIZE_201, 4cm depth,20cm spacing,1row/ridge,0–63; batches <=4ridges
  - Commit/recheck real planting, never inject planted or mature state
  emergence_and_seedling:
  - Advance and observe public stage and water; no internal DVS/RFTRA access
  vegetative:
  - Apply only declared water/N policy through public tools and receipts
  reproductive_and_grain_fill:
  - Continue same observation schedule; do not infer VT/R1 from hidden truth
  maturity_and_harvest:
  - Wait on public maturity/moisture/weather/trafficability; refuel as needed
  - Harvest <=4ridges per call, unload based on bin capacity; finish all64
  postharvest:
  - Dry only if needed to <=14%; record dry matter separately from removed water
  - Strict safe store; bin/trailer empty, inventory and resources reconcile
